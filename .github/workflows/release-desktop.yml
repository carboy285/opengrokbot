name: Package desktop workspace
on:
  push:
    branches: [feature/desktop-workspace]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed Windows and notarized Mac installers (requires signing secrets)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      MACOS_SIGN_IDENTITY: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.MACOS_SIGN_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Developer ID signing and notarization
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test "$MACOS_SIGN_IDENTITY" != '-' && test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_PASSWORD" || { echo 'Configure the Apple signing secrets listed in docs/DESKTOP_0_7.md before requesting signed installers.' >&2; exit 1; }
          KEYCHAIN_PASS=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/opengrokbot.keychain-db"
          export CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          Path(os.environ['CERTIFICATE_PATH']).write_bytes(base64.b64decode(os.environ['CERTIFICATE']))
          PY
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          xcrun notarytool store-credentials OpenGrokBotCI --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo 'MACOS_NOTARY_PROFILE=OpenGrokBotCI' >> "$GITHUB_ENV"
      - name: Package universal Mac installer
        run: ./scripts/build-macos.sh
      - name: Archive matching sources
        run: git archive --format=zip --prefix=OpenGrokBot-0.8.7/ --output=artifacts/OpenGrokBot-0.8.7-Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.sha256
            artifacts/*-Source.zip
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/opengrokbot.keychain-db" || true
  ios_sources:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile matching iPhone sources without running tests
        run: >-
          xcodebuild -project GrokBot.xcodeproj -scheme GrokBot
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require credentials for a signed installer
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw 'Configure WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD before requesting signed installers.' }
      - run: npm ci
      - name: Run desktop unit tests
        run: npm run test:desktop
      - name: Package Windows installer
        shell: pwsh
        run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows/*Setup.exe
          if-no-files-found: error
  publish:
    needs: [mac, windows, ios_sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true
      - name: Publish development downloads
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: |
          cat > /tmp/desktop-release.md <<'NOTES'
          0.8.7: smoother, quieter, and able to use a VM on another computer. Smoother: switching Bots and sending messages no longer wait for the disk (changes are saved a moment later and when you quit), streaming replies redraw about twenty times a second instead of on every word, each message redraws only when it changes, the chat and sidebar look up messages once per change instead of once per row, and Windows sends the window updates at most twelve times a second and no longer rescans the whole chat for every message. Pinned Bots are back as tiles at the top of the sidebar on Mac, iPhone and Windows (the 0.8.7 single-hero layout is gone). Browsing stays out of your way: when a Bot uses its browser nothing opens on your screen. While it works, a bar above the message box says what it is doing and has Show browser (and Pause & take over on Mac); the Open local browser button in Bot details still opens it. Closing the window while the Bot is using it just hides it again. Web search uses Composio’s search tool: search_web goes to Composio instead of the browser, and Composio’s search toolkit is added to your project automatically (it needs no sign-in). If Composio is not set up, or the search fails, the Bot’s hidden browser is used instead and the result says so. A VM on another computer: turn on “Let my other computers use this VM” (after “Allow guest commands”) on the computer that has the VM, then on another computer open a Bot’s details and choose the VM under “VM on another computer”. That Bot’s guest commands run in the shared VM over your encrypted account connection, between Mac and Windows in either direction. The first time, approve the new computer on the one that shares the VM. Not in this release: looking at a shared VM’s screen from another computer, iPhone-started VM commands, and anything on a real device: nothing here has been tried on real devices yet, and the Composio search tool names and the hidden-window behaviour of the browser are untested against the live services.

          Download the Mac DMG or Windows Setup EXE, or open GrokBot.xcodeproj from the source archive for iPhone installation. Keep your existing bundle identifier and signing team for iPhone upgrades.

          Desktop unit and fixture UI checks passed on Linux. Voice, microphone, echo cancellation, Mac and iPhone runtime behavior, and physical-device interoperability have not been verified. Building the installers does not establish runtime correctness.
          NOTES
          if [ "$SIGNED" = true ]; then
            echo 'Installers were built with configured Windows signing and Apple Developer ID/notarization credentials.' >> /tmp/desktop-release.md
          else
            echo 'Development installers: the Mac app is ad-hoc signed and not notarized; the Windows installer is unsigned. Trusted publisher signing still requires the owner’s signing credentials.' >> /tmp/desktop-release.md
          fi
          # Artifacts preserve the macos subdirectory; upload files, never directories.
          shopt -s nullglob
          release_files=(downloads/*.zip downloads/macos/*.dmg downloads/macos/*.sha256 downloads/*.exe)
          test "${#release_files[@]}" -ge 3 || { echo 'Expected Mac, Windows and source downloads.' >&2; exit 1; }
          # A failed asset upload can leave an unpublished draft. Public releases are kept.
          draft_id=$(gh api 'repos/carboy285/opengrokbot/releases?per_page=100' --jq '[.[] | select(.tag_name == "v0.8.7" and .draft == true)] | .[0].id // empty')
          if [ -n "$draft_id" ]; then gh api --method DELETE "repos/carboy285/opengrokbot/releases/$draft_id"; fi
          gh release create v0.8.7 --target "$GITHUB_SHA" --title 'OpenGrokBot 0.8.7 · Smoother, with VMs across computers' --prerelease --notes-file /tmp/desktop-release.md "${release_files[@]}"
