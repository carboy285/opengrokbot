name: Package desktop workspace
on:
  push:
    branches: [feature/desktop-workspace]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed Windows and notarized Mac installers (requires signing secrets)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      MACOS_SIGN_IDENTITY: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.MACOS_SIGN_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Developer ID signing and notarization
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test "$MACOS_SIGN_IDENTITY" != '-' && test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_PASSWORD" || { echo 'Configure the Apple signing secrets listed in docs/DESKTOP_0_7.md before requesting signed installers.' >&2; exit 1; }
          KEYCHAIN_PASS=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/opengrokbot.keychain-db"
          export CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          Path(os.environ['CERTIFICATE_PATH']).write_bytes(base64.b64decode(os.environ['CERTIFICATE']))
          PY
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          xcrun notarytool store-credentials OpenGrokBotCI --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo 'MACOS_NOTARY_PROFILE=OpenGrokBotCI' >> "$GITHUB_ENV"
      - name: Package universal Mac installer
        run: ./scripts/build-macos.sh
      - name: Archive matching sources
        run: git archive --format=zip --prefix=OpenGrokBot-0.9.2/ --output=artifacts/OpenGrokBot-0.9.2-Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.sha256
            artifacts/*-Source.zip
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/opengrokbot.keychain-db" || true
  ios_sources:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile matching iPhone sources without running tests
        run: >-
          xcodebuild -project GrokBot.xcodeproj -scheme GrokBot
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require credentials for a signed installer
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw 'Configure WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD before requesting signed installers.' }
      - run: npm ci
      - name: Run desktop unit tests
        run: npm run test:desktop
      - name: Package Windows installer
        shell: pwsh
        run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows/*Setup.exe
          if-no-files-found: error
  publish:
    needs: [mac, windows, ios_sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true
      - name: Publish development downloads
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: |
          cat > /tmp/desktop-release.md <<'NOTES'
          0.9.2: a UI-only update that makes the apps look and feel much more like Grok Bot, on Mac, iPhone and Windows. A deeper, quieter dark look. Sidebar avatars show what each Bot is doing: a turning purple ring while it works, an orange ring and “Needs your OK” while it waits for you. When a Bot needs your OK, a card appears in the chat above the message box with exactly what it wants to do and Deny / Allow once (Touch ID where a saved login is used), instead of a system pop-up; your iPhone gets the same card. Bots can now ask you a question with buttons (one tap to answer, Submit when several apply, “Something else…” to type your own). Messages Bots send each other show the sender’s avatar and name (“Travel → Grok Bot”, “Calendar Agent replied”) with a dashed outline, so you can tell Bots talking from you. Tool steps (reading a page, running a VM command) are small pills you can click open instead of raw text. Typing dots with “Thinking it through” while a Bot works, “Delivered” only under your latest message, the model name only on hover, a cleaner composer and header. Built on 0.9.1, so every 0.9.1 feature is kept. Compiled for Mac and iPhone by CI; not yet tried on real devices.
          0.9.1: the shared Linux VM works first time. Fixes from a real Windows 11 PC with Hyper-V: the VM installs Ubuntu's guest tools itself and repairs them at every boot until they run (removes the cdrom apt source, finishes interrupted dpkg), so setup no longer sticks at "Installing Guest Additions"; the first command test waits for the guest tools to settle, retries VERR_DUPLICATE for up to 10 minutes and restarts the VM once before giving up; paravirtualisation is always off; "already locked by a session" no longer fails; new VMs sign in automatically, have no screen lock and let the bot account use sudo without a password (each can be turned off before setup); Copy guest login works (clipboard permission); copy and paste between Windows and the VM is a setting (Off, Windows to VM, VM to Windows, Both); Update guest password, and Reset guest password without the old one (only a SHA-512 hash is sent to the VM); Delete VM; computers listed twice show once, and the Mac can remove the old entries (needs the account database update in supabase/migrations); the Mac says when the other computer still has to approve it; a VM deleted outside the app shows "Set up again"; Retry appears after a failure or 20 minutes of installing. Not tried on real devices yet.
          0.9.0: the shared Linux VM sets itself up. On Windows, Settings → Shared Linux VM → Set up installs VirtualBox if needed, downloads and checks Ubuntu 24.04, creates the VM, installs it with automatic sign-in, waits until commands work, then shares it. The Mac can now list the PC's VM (a name mismatch broke this in 0.8.9). Opening a running VM no longer errors, a stopped VM is started before a Bot command, and Bots are told whether the VM is ready. Not tried on real devices: VirtualBox install, Ubuntu download and install, auto-login and the progress watcher.
          0.8.9: one shared VM for all your Bots, with a hand-over pop-up. All Bots now use the same Linux VM: set it up once under Settings → Computer, or choose a VM that another of your computers is sharing (Mac or Windows, either way); the per-Bot VM settings are gone. When a Bot needs you in the VM (to sign in, pick something, approve something only you can), it asks, a pop-up appears with the VM screen where it can be shown and an Open VM button, the Bot waits, and it carries on when you press “I’m done — continue” (or stops if you press Cancel task). You can control the VM from the pop-up itself, even when it is on another computer: click the picture of its screen to click, type into the box, and use the Enter, Tab, Esc and Backspace buttons. Each action takes a second or two, and it needs xdotool and an Xorg desktop session in the VM (on Ubuntu: sudo apt install xdotool, and sign in with “Ubuntu on Xorg”, because Wayland does not work). Open VM still opens the VM’s own window on the computer that has it. Bots still search the web through Composio and browse on their own. Also included: everything from 0.8.9 (connected apps fix, smoother app, pinned tiles, hidden browser, Composio search). Nothing here has been tried on real devices.

          Download the Mac DMG or Windows Setup EXE, or open GrokBot.xcodeproj from the source archive for iPhone installation. Keep your existing bundle identifier and signing team for iPhone upgrades.

          Desktop unit and fixture UI checks passed on Linux. Voice, microphone, echo cancellation, Mac and iPhone runtime behavior, and physical-device interoperability have not been verified. Building the installers does not establish runtime correctness.
          NOTES
          if [ "$SIGNED" = true ]; then
            echo 'Installers were built with configured Windows signing and Apple Developer ID/notarization credentials.' >> /tmp/desktop-release.md
          else
            echo 'Development installers: the Mac app is ad-hoc signed and not notarized; the Windows installer is unsigned. Trusted publisher signing still requires the owner’s signing credentials.' >> /tmp/desktop-release.md
          fi
          # Artifacts preserve the macos subdirectory; upload files, never directories.
          shopt -s nullglob
          release_files=(downloads/*.zip downloads/macos/*.dmg downloads/macos/*.sha256 downloads/*.exe)
          test "${#release_files[@]}" -ge 3 || { echo 'Expected Mac, Windows and source downloads.' >&2; exit 1; }
          # A failed asset upload can leave an unpublished draft. Public releases are kept.
          draft_id=$(gh api 'repos/carboy285/opengrokbot/releases?per_page=100' --jq '[.[] | select(.tag_name == "v0.9.2" and .draft == true)] | .[0].id // empty')
          if [ -n "$draft_id" ]; then gh api --method DELETE "repos/carboy285/opengrokbot/releases/$draft_id"; fi
          gh release create v0.9.2 --target "$GITHUB_SHA" --title 'OpenGrokBot 0.9.2 · Looks like Grok Bot' --prerelease --notes-file /tmp/desktop-release.md "${release_files[@]}"
