name: Package desktop workspace
on:
  push:
    branches: [feature/desktop-workspace]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed Windows and notarized Mac installers (requires signing secrets)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      MACOS_SIGN_IDENTITY: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.MACOS_SIGN_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Developer ID signing and notarization
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test "$MACOS_SIGN_IDENTITY" != '-' && test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_PASSWORD" || { echo 'Configure the Apple signing secrets listed in docs/DESKTOP_0_7.md before requesting signed installers.' >&2; exit 1; }
          KEYCHAIN_PASS=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/opengrokbot.keychain-db"
          export CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          Path(os.environ['CERTIFICATE_PATH']).write_bytes(base64.b64decode(os.environ['CERTIFICATE']))
          PY
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          xcrun notarytool store-credentials OpenGrokBotCI --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo 'MACOS_NOTARY_PROFILE=OpenGrokBotCI' >> "$GITHUB_ENV"
      - name: Package universal Mac installer
        run: ./scripts/build-macos.sh
      - name: Archive matching sources
        run: git archive --format=zip --prefix=OpenGrokBot-0.8.6/ --output=artifacts/OpenGrokBot-0.8.6-Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.sha256
            artifacts/*-Source.zip
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/opengrokbot.keychain-db" || true
  ios_sources:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile matching iPhone sources without running tests
        run: >-
          xcodebuild -project GrokBot.xcodeproj -scheme GrokBot
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require credentials for a signed installer
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw 'Configure WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD before requesting signed installers.' }
      - run: npm ci
      - name: Run desktop unit tests
        run: npm run test:desktop
      - name: Package Windows installer
        shell: pwsh
        run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows/*Setup.exe
          if-no-files-found: error
  publish:
    needs: [mac, windows, ios_sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true
      - name: Publish development downloads
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: |
          cat > /tmp/desktop-release.md <<'NOTES'
          0.8.6: a Grok-Bot-style set of screens, new tools, and much faster voice. Look: a narrower chat column with 16 pt text, a calmer sidebar (one hero Bot, pinned Bots first with a pin, a footer with your profile, Connect apps and an update arrow), a taller pill message box with a plain + and a mic for dictation, a real Accent setting, and a small Create a Bot dialog with 14 shapes and 10 colours. Find things fast: Ctrl/⌘K opens a command palette that searches Bots (with the last message) and runs New Bot, Settings, Permissions, Connect apps and Keyboard shortcuts (New group chat and Computers on Mac). Bot rows have a menu to pin, move to a section, mark unread, rename, copy the conversation ID, hide and delete. Hovering a message shows React, Reply and More (copy text, copy as Markdown, retry, delete) on Mac and Windows; on iPhone the same items are on long-press. Teach a task (Mac): the + menu starts a recorder that notes which apps you open and where you click, plus steps and notes you add (secrets are masked, no keystrokes or screen contents are read), then saves an editable instruction to the Bot’s memory. Permissions: Settings → Permissions has Always ask and Allow without asking lists with Add rule, checked before any approval dialog. On Mac you can allow Reminders, Calendar, Contacts and Notes changes or force a question, and force a question before clicks on a website; on Windows rules can force a question before clicks on a website. Deleting, sending, typing-and-submitting, saved logins and unattended runs always ask. Bot details: a Voice chat card (voice, speed 0.75× to 1.5×, language) saved per Bot, Routines with Pause, Resume and Delete, and Providers & models at the bottom in a collapsible section. Connect apps: a stack of connected app avatars, search, category chips, Recommended grid and View all on Mac and Windows. Voice is faster: replies start speaking after about 14 characters or at a word boundary, the app waits 0.4 to 0.6 seconds of quiet instead of 0.9, reply checks run every 40 ms, up to three speech clips are fetched at once over a kept-open connection, and ElevenLabs uses a smaller audio format. iPhone: the new composer (plain +, mic for dictation, round waveform or send button), one hero Bot with pinned Bots in the list, long-press message actions, and the new Create a Bot screen with shapes and colours; reacting to or deleting a message on iPhone, and creating a Bot with a shape, need this version on the computer too. Windows dictation records until you tap the mic again and then sends the audio to the speech-to-text provider you chose under Settings → Voice; there is no built-in recognizer. Not in this release: Teach a task on Windows or iPhone, adding Connect apps after the project is connected on Windows, New group chat on Windows, a Language setting that translates the app, the cloud runner and widgets. Nothing here has been tried on real devices yet.

          Download the Mac DMG or Windows Setup EXE, or open GrokBot.xcodeproj from the source archive for iPhone installation. Keep your existing bundle identifier and signing team for iPhone upgrades.

          Desktop unit and fixture UI checks passed on Linux. Voice, microphone, echo cancellation, Mac and iPhone runtime behavior, and physical-device interoperability have not been verified. Building the installers does not establish runtime correctness.
          NOTES
          if [ "$SIGNED" = true ]; then
            echo 'Installers were built with configured Windows signing and Apple Developer ID/notarization credentials.' >> /tmp/desktop-release.md
          else
            echo 'Development installers: the Mac app is ad-hoc signed and not notarized; the Windows installer is unsigned. Trusted publisher signing still requires the owner’s signing credentials.' >> /tmp/desktop-release.md
          fi
          # Artifacts preserve the macos subdirectory; upload files, never directories.
          shopt -s nullglob
          release_files=(downloads/*.zip downloads/macos/*.dmg downloads/macos/*.sha256 downloads/*.exe)
          test "${#release_files[@]}" -ge 3 || { echo 'Expected Mac, Windows and source downloads.' >&2; exit 1; }
          # A failed asset upload can leave an unpublished draft. Public releases are kept.
          draft_id=$(gh api 'repos/carboy285/opengrokbot/releases?per_page=100' --jq '[.[] | select(.tag_name == "v0.8.6" and .draft == true)] | .[0].id // empty')
          if [ -n "$draft_id" ]; then gh api --method DELETE "repos/carboy285/opengrokbot/releases/$draft_id"; fi
          gh release create v0.8.6 --target "$GITHUB_SHA" --title 'OpenGrokBot 0.8.6 · Calmer, quicker, faster voice' --prerelease --notes-file /tmp/desktop-release.md "${release_files[@]}"
