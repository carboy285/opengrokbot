name: Native macOS app and DMG
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          python3 - <<'PY' > /tmp/opengrokbot-xcode.txt
          from pathlib import Path
          import re
          apps = list(Path('/Applications').glob('Xcode_*.app'))
          def key(path): return tuple(int(n) for n in re.findall(r'\d+', path.name))
          print(str(max(apps,key=key) if apps else Path('/Applications/Xcode.app')) + '/Contents/Developer')
          PY
          sudo xcode-select --switch "$(cat /tmp/opengrokbot-xcode.txt)"
          xcodebuild -version
      - name: Run native macOS tests
        run: >-
          xcodebuild -project GrokBot.xcodeproj -scheme GrokBotMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath artifacts/macos-debug
          -resultBundlePath artifacts/macos-tests.xcresult
          -only-testing:GrokBotMacTests
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- test
      - name: Capture and verify real application windows
        timeout-minutes: 8
        run: >-
          xcodebuild -project GrokBot.xcodeproj -scheme GrokBotMac
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath artifacts/macos-debug
          -resultBundlePath artifacts/macos-ui-tests.xcresult
          -only-testing:GrokBotMacUITests
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- test
      - name: Export native view screenshots
        if: always()
        run: |
          if [ -d artifacts/macos-ui-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/macos-ui-tests.xcresult --output-path artifacts/visuals
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenGrokBot-macOS-visuals
          path: |
            artifacts/visuals/**/*.png
            artifacts/visuals/**/*.json
            artifacts/visuals/**/*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenGrokBot-macOS-test-results
          path: artifacts/*.xcresult
          if-no-files-found: warn
      - name: Build universal app and DMG
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGrokBot-macOS
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:cloud
      - run: npm run test:desktop
      - run: node scripts/test-electron.cjs
      - run: npm run dist:windows
      - run: node scripts/test-packaged-helper.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGrokBot-Windows
          path: artifacts/windows/*Setup.exe
          if-no-files-found: error
